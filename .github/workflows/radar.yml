name: Job Radar
on:
  schedule:
    - cron: "37 3,9,15,21 * * *"   # every 6 hours (UTC) = 09:07, 15:07, 21:07, 03:07 India time
  workflow_dispatch: {}            # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40          # enough history to see when radar.db was last backed up

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # radar.db lives in GitHub's cache between runs (fast, no repo growth).
      # The repo keeps a once-a-day backup copy, used if the cache is empty or older.
      - name: Keep the repo's backup copy of radar.db
        run: cp radar.db "$RUNNER_TEMP/radar.backup.db" 2>/dev/null || true

      - name: Restore latest radar.db from cache
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-db-

      - name: Use the newest radar.db (cache or backup)
        run: python3 pick_db.py "$RUNNER_TEMP/radar.backup.db" radar.db

      - name: Scrape
        run: python3 run.py

      - name: Export dashboard data
        run: python3 export.py

      - name: Validate data (blocks saving if jobs.json is broken)
        run: python3 validate.py

      - name: Compact radar.db
        run: python3 -c "import sqlite3; c = sqlite3.connect('radar.db'); c.execute('VACUUM'); c.close()"

      - name: Save radar.db to cache
        uses: actions/cache/save@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add docs/jobs.json
          last=$(git log -1 --format=%ct -- radar.db 2>/dev/null)
          if [ $(( $(date +%s) - ${last:-0} )) -gt 72000 ]; then
            git add radar.db
            echo "Including the daily backup of radar.db"
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to save"
            exit 0
          fi
          git commit -m "radar: update jobs"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            echo "Push failed (attempt $i of 3), retrying in 10 seconds"
            sleep 10
          done
          exit 1

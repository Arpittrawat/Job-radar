name: Job Radar
on:
  schedule:
    - cron: "37 3,9,15,21 * * *"   # every 6 hours: 09:07, 15:07, 21:07, 03:07 India time
  workflow_dispatch: {}            # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape
        run: python3 run.py
      - name: Export dashboard data
        run: python3 export.py
      - name: Save results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add radar.db docs/jobs.json
          git diff --cached --quiet || git commit -m "radar: update jobs"
          git push

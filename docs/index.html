<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Job Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#F2F2F7; --b1:#C9DDF7; --b2:#D3ECF2; --b3:#E2E4F3; --b4:#DCE8FA;
  --g:rgba(255,255,255,.55); --gb:rgba(255,255,255,.7); --hi:rgba(255,255,255,.95); --spec:rgba(255,255,255,.5); --sh:rgba(0,0,0,.07);
  --card:rgba(255,255,255,.74); --cardsolid:#FFFFFF; --tile:rgba(255,255,255,.66);
  --ink:#1D1D1F; --mute:rgba(60,60,67,.6); --faint:rgba(60,60,67,.3); --sep:rgba(60,60,67,.12); --fill:rgba(118,118,128,.12);
  --dim:rgba(242,242,247,.62); --blue:#007AFF; --hot:#1D1D1F; --green:#34C759; --red:#FF3B30; --on:rgba(118,118,128,.16);
  --spring:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root{
  --base:#000000; --b1:#0B2549; --b2:#062F38; --b3:#151A3A; --b4:#0D2240;
  --g:rgba(30,30,32,.38); --gb:rgba(255,255,255,.14); --hi:rgba(255,255,255,.22); --spec:rgba(255,255,255,.08); --sh:rgba(0,0,0,.5);
  --card:rgba(22,22,24,.62); --cardsolid:#1C1C1E; --tile:rgba(40,40,42,.5);
  --ink:#F5F5F7; --mute:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3); --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24);
  --dim:rgba(0,0,0,.18); --blue:#0A84FF; --hot:#FFFFFF; --green:#30D158; --red:#FF453A; --on:rgba(118,118,128,.32);
}}
@media (prefers-reduced-transparency:reduce){:root{--g:var(--cardsolid);--card:var(--cardsolid);--tile:var(--cardsolid)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  color:var(--ink);background:var(--base);font-size:15px;line-height:1.35;letter-spacing:-.01em;font-feature-settings:"tnum" 1}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ambient background */
.wall{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--base)}
.wall i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75}
.wall i:nth-child(1){width:70vw;height:70vh;left:-18vw;top:-25vh;background:var(--b1)}
.wall i:nth-child(2){width:60vw;height:65vh;right:-15vw;top:12vh;background:var(--b2)}
.wall i:nth-child(3){width:55vw;height:55vh;left:22vw;bottom:-28vh;background:var(--b3)}
.wall i:nth-child(4){width:40vw;height:40vh;left:42vw;top:-15vh;background:var(--b4);opacity:.7}
/* optional photo: put bg.jpg in the docs folder. A dim layer keeps text readable. */
.wall::before{content:"";position:absolute;inset:0;z-index:1;
  background:url("bg.jpg") center/cover no-repeat}
.wall::after{content:"";position:absolute;inset:0;background:var(--dim);z-index:2}

/* glass material: functional layer only */
/* content material: thick, blurred, lets the wallpaper tint through (Apple 'regular material') */
.list,.hero,.fact,.grp{backdrop-filter:blur(44px) saturate(1.8);-webkit-backdrop-filter:blur(44px) saturate(1.8);border:1px solid var(--gb)}
.glass{position:relative;background:var(--g);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);
  border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hi),0 12px 40px var(--sh)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,var(--spec) 0%,transparent 38%,transparent 70%,rgba(255,255,255,.08) 100%)}
.glass>*:not(.thumb){position:relative;z-index:1}

/* ---------- desktop ---------- */
.app{display:grid;grid-template-columns:250px 400px 1fr;gap:12px;height:100vh;padding:14px}
.side{border-radius:24px;padding:22px 12px 16px;display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.brand{font-size:13px;font-weight:600;color:var(--mute);padding:2px 10px 14px}
.sh{font-size:11px;font-weight:600;color:var(--mute);padding:16px 10px 6px}
.si{display:flex;align-items:center;width:100%;padding:7px 10px;border-radius:11px;font-size:13.5px;text-align:left;position:relative;transition:background .2s var(--spring)}
.si:hover{background:var(--fill)}
.si[aria-pressed=true]{background:var(--on);font-weight:600}
.sic{width:17px;height:17px;margin-right:9px;color:var(--blue);flex:none}
.si.zero .sic{color:inherit}
.si .ct{margin-left:auto;color:var(--mute);font-weight:400;font-size:12px}
.si.zero{opacity:.38}
.si[aria-pressed=true] .ct{font-size:11px}
.clear{display:block;margin:0 10px 10px;padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;color:var(--blue);background:var(--on);box-shadow:inset 0 1px 0 var(--hi)}
.clear[hidden]{display:none}
.mclear{margin:8px 0 0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;font-size:13.5px;width:100%;margin-top:8px}
.switch{width:34px;height:20px;border-radius:10px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--sep);position:relative;transition:background .25s var(--spring);flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.sw[aria-checked=true] .switch{background:var(--green)}
.sw[aria-checked=true] .switch::after{transform:translateX(14px)}
.credit{display:block;padding:6px 10px 0;font-size:10px;color:var(--faint);text-decoration:none}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11px;color:var(--mute);line-height:1.6}
.bad{color:var(--red)}

.list{background:var(--card);border-radius:22px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 12px 40px var(--sh)}
.list-head{padding:22px 20px 8px}
.list-head h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.list-head p{font-size:12px;color:var(--mute);margin-top:3px}
.rows{overflow-y:auto;flex:1;padding:0 10px 24px;outline:none}
.day{font-size:12px;font-weight:600;color:var(--mute);padding:14px 12px 6px}
.row{display:block;width:100%;text-align:left;padding:10px 12px 11px 24px;border-radius:13px;position:relative;transition:background .15s}
.row+.row::before{content:"";position:absolute;left:24px;right:12px;top:0;border-top:1px solid var(--sep)}
.row:hover{background:var(--fill)}
.row[aria-selected=true]{background:var(--blue);color:#fff}
.row[aria-selected=true]::before,.row[aria-selected=true]+.row::before{border-color:transparent}
.r1{display:flex;align-items:baseline;gap:8px;font-size:13px}
.r1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.age{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.age.hot{color:var(--hot);font-weight:600}
.r2{font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r3{font-size:12px;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row[aria-selected=true] .age,.row[aria-selected=true] .r3{color:rgba(255,255,255,.85)}
.dot{position:absolute;left:9px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.row[aria-selected=true] .dot{background:#fff}
.row.done .r2{text-decoration:line-through;text-decoration-color:var(--faint)}
.check{color:var(--green);font-weight:700;margin-right:4px}
.row[aria-selected=true] .check{color:#fff}
.row.leaving{animation:leave .38s var(--spring) forwards}
@keyframes leave{to{opacity:0;transform:translateX(26px)}}

.detail{position:relative;overflow-y:auto;padding:76px 26px 30px 14px;min-width:0}
.toolbar{position:absolute;top:6px;right:10px;display:flex;gap:8px;z-index:3}
.pill{height:38px;border-radius:19px;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:14px;font-weight:500}
.pill.search{width:240px;padding:0 14px}
.pill.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px}
.pill.search input::placeholder{color:var(--mute)}
.pill svg{flex:none;opacity:.55}
.detail-inner{max-width:760px;animation:fadein .3s var(--spring)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.hero{background:var(--card);border-radius:22px;padding:28px 30px 30px;box-shadow:0 1px 2px var(--sh),0 8px 30px var(--sh)}
.d-co{font-size:13px;color:var(--mute)}
.d-title{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;font-size:28px;line-height:1.18;font-weight:700;letter-spacing:-.012em;margin:6px 0 6px}
.d-sub{font-size:15px;color:var(--mute)}
.d-sub .hot{color:var(--hot);font-weight:600}
.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 22px;border-radius:21px;font-size:14px;font-weight:600;text-decoration:none;transition:transform .25s var(--spring),filter .2s}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.glass{color:var(--ink)}
.btn.done{color:var(--green)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--tile);border-radius:16px;padding:13px 16px;box-shadow:0 1px 2px var(--sh)}
.fact small{display:block;font-size:11px;color:var(--mute);margin-bottom:3px}
.fact span{font-size:14px;font-weight:500}
/* Apple grouped sections */
.sec{margin-top:26px;max-width:760px}
.sec h3{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 7px 16px}
.glist{background:var(--card);border:1px solid var(--gb);border-radius:14px;overflow:hidden;backdrop-filter:blur(44px) saturate(1.8);-webkit-backdrop-filter:blur(44px) saturate(1.8)}
.glist.pad{padding:14px 16px}
.prow{display:flex;gap:12px;align-items:center;padding:12px 14px 12px 16px;position:relative}
.prow+.prow::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--sep)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;flex:none;background:linear-gradient(180deg,#8E8E93,#636366)}
.av-f{background:linear-gradient(180deg,#5AC8FA,#007AFF)}.av-m{background:linear-gradient(180deg,#A78BFA,#5E5CE6)}.av-h{background:linear-gradient(180deg,#8E8E93,#48484A)}.av-e{background:linear-gradient(180deg,#34C759,#248A3D)}
.pinfo{flex:1;min-width:0}
.pname{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{font-size:11px;font-weight:500;color:var(--mute);background:var(--fill);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.ptitle{font-size:13px;color:var(--mute);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meters{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.gm{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mute)}
.gm-bar{width:54px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.gm-bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.gm:nth-child(2) .gm-bar i{background:var(--ink);opacity:.7}
.gm-v{font-weight:600;color:var(--ink);min-width:28px}
.pact{display:flex;gap:6px;flex:none}
.pill-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:14px;background:var(--fill);color:var(--ink);font-size:12px;font-weight:600;text-decoration:none}
.pill-btn svg{width:13px;height:13px}
.pill-btn:hover{background:var(--on)}
.pill-btn.blue{background:var(--blue);color:#fff}
.need{display:flex;gap:16px;align-items:flex-start}
.need-v{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em;min-width:68px}
.need-v small{font-size:17px;font-weight:600;color:var(--mute);margin-left:1px}
.need-t{font-size:15px;font-weight:600;margin-bottom:4px}
.why{margin:0;padding-left:16px;font-size:13px;color:var(--mute);line-height:1.5}
.btn.wide{width:100%;margin-top:10px;height:44px}
.hint{font-size:12px;color:var(--mute);margin:7px 16px 0}
.facts-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.facts-line a{color:var(--blue);text-decoration:none}
.dot-sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.desc{white-space:pre-line;font-size:14px;line-height:1.55;max-height:220px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.desc.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.more{margin:6px 0 0 16px;color:var(--blue);font-size:14px;font-weight:500}
.sheet .sec h3{margin-left:4px}
@media (max-width:899px){.pname{white-space:normal}.prow{align-items:flex-start}.pact{flex-direction:column;align-items:flex-end}}.sheet .prow+.prow::before{left:62px}
.founders{margin-top:18px;border-top:1px solid var(--sep);padding-top:12px}
.fh{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
.frow{display:flex;align-items:center;gap:12px;padding:8px 0}
.frow+.frow{border-top:1px solid var(--sep)}
.fnames{margin-top:12px;font-size:15px;font-weight:500}
.fnames span{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:2px}
.headline{margin-top:14px;font-size:15px;line-height:1.45;color:var(--mute);max-width:62ch}
.amt{color:var(--ink);font-weight:700}
[hidden]{display:none!important}
.note{margin-top:16px;font-size:13px;color:var(--mute)}
.kbd{margin-top:26px;font-size:12px;color:var(--mute)}
.kbd kbd{font:inherit;border:1px solid var(--sep);background:var(--tile);border-radius:6px;padding:1px 6px;margin:0 2px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mute);padding:40px}
.empty h2{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:4px}
.empty p{font-size:13px;max-width:280px}
@media (max-width:1180px){.app{grid-template-columns:220px 340px 1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- phone / tablet ---------- */
.m,.tabbar,.fab,.fade{display:none}
@media (max-width:899px){
  .app{display:none}
  .m{display:block;max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 16px 140px}
  .m h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.022em}
  .m .sub{font-size:15px;color:var(--mute);margin:2px 0 16px}
  .msearch{display:none;height:42px;border-radius:21px;margin-bottom:12px;align-items:center;gap:8px;padding:0 14px}
  .msearch.show{display:flex;animation:fadein .3s var(--spring)}
  .msearch input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:17px}
  .msearch input::placeholder{color:var(--mute)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;padding:3px;margin-bottom:14px}
  .seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:19px;background:rgba(255,255,255,.88);
    box-shadow:0 4px 12px var(--sh),inset 0 1px 0 #fff;transition:transform .45s var(--spring)}
  @media (prefers-color-scheme:dark){.seg .thumb{background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}}
  .seg button{position:relative;z-index:1;font-size:14px;font-weight:500;padding:9px 4px}
  .seg button[aria-pressed=true]{font-weight:600}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border-radius:19px;padding:7px 15px;font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
  .chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:transparent}
  .chip[aria-pressed=true]::before{display:none}
  .chip.glass{box-shadow:inset 0 1px 0 var(--hi)}
  .gh{font-size:13px;color:var(--mute);text-transform:uppercase;padding:20px 16px 7px}
  .grp{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px var(--sh)}
  .mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px 12px 16px;position:relative;min-height:62px}
  .mrow:active{background:var(--fill)}
  .mrow+.mrow::before{content:"";position:absolute;top:0;left:42px;right:0;border-top:1px solid var(--sep)}
  .mdot{width:10px;height:10px;border-radius:50%;flex:none}
  .mdot.on{background:var(--blue)}.mdot.done{background:var(--green)}
  .mtx{flex:1;min-width:0}
  .mt{display:block;font-size:16px;font-weight:600;line-height:21px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mrow.done .mt{text-decoration:line-through;text-decoration-color:var(--faint)}
  .ms{display:block;font-size:14px;color:var(--mute);line-height:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mage{font-size:14px;color:var(--mute);white-space:nowrap}
  .mage.hot{color:var(--hot);font-weight:600}
  .chev{color:var(--faint);font-size:22px;line-height:1;margin-left:-4px}
  .msw{margin-top:22px;background:var(--card);border-radius:18px;padding:12px 16px;font-size:16px}
  .msw .switch{width:51px;height:31px;border-radius:16px}
  .msw .switch::after{width:27px;height:27px}
  .msw[aria-checked=true] .switch::after{transform:translateX(20px)}
  .mfoot{font-size:13px;color:var(--mute);padding:18px 16px 0;line-height:1.6}
  .m .empty{height:auto;padding:60px 20px}
  .fade{display:block;position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:9;
    background:linear-gradient(transparent,color-mix(in srgb,var(--base) 88%,transparent))}
  .tabbar{display:flex;position:fixed;left:16px;right:88px;bottom:calc(env(safe-area-inset-bottom) + 16px);height:64px;border-radius:32px;
    justify-content:space-around;align-items:center;padding:0 6px;z-index:10;max-width:420px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:6px 16px;border-radius:24px;color:var(--mute);transition:background .3s var(--spring),color .3s}
  .tab svg{width:22px;height:22px}
  .tab[aria-pressed=true]{color:var(--blue);background:var(--on)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);width:64px;height:64px;border-radius:50%;z-index:10}
}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;padding:12px 18px;border-radius:22px;font-size:14px;font-weight:500;
  transition:opacity .3s,transform .4s var(--spring);z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;background:rgba(40,20,20,.28);opacity:0;pointer-events:none;transition:opacity .4s var(--spring);z-index:20}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;max-height:86vh;overflow-y:auto;border-radius:38px;z-index:21;
  padding:10px 22px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(110%);transition:transform .5s var(--spring);
  --g:color-mix(in srgb,var(--cardsolid) 90%,transparent);visibility:hidden}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 10px}
.sheet .done-btn{position:absolute;right:22px;top:20px;color:var(--blue);font-size:17px;font-weight:600;z-index:2}
.sheet .detail-inner{animation:none}
.sheet .d-co{margin-top:14px}
.sheet .d-title{font-size:25px}
.sheet .actions{flex-direction:column}
.sheet .btn{height:52px;border-radius:26px;font-size:17px}
.sheet .facts{grid-template-columns:1fr 1fr}
.sheet .fact{box-shadow:none}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="wall" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<!-- Mac / laptop -->
<div class="app" id="app">
  <nav class="side glass" aria-label="Filters">
    <div class="brand">Job Radar</div>
    <button class="clear" id="s-clear" hidden>Clear filters</button>
    <div id="s-views"></div>
    <div id="s-jobf">
    <div class="sh">Role</div><div id="s-roles"></div>
    <div class="sh">Location</div><div id="s-locs"></div>
    <div class="sh">Board</div><div id="s-boards"></div>
    <button class="sw" role="switch" aria-checked="false" id="s-other"><span>Show other titles</span><span class="switch"></span></button>
    </div>
    <div id="s-fundf" hidden><div class="sh">Region</div><div id="s-fregion"></div><div class="sh">Round</div><div id="s-fround"></div></div>
    <div class="side-foot" id="s-foot"></div>
    <a class="credit" href="https://unsplash.com/photos/starry-night-sky-over-snow-covered-mountains-ktllNfb9cBs" target="_blank" rel="noopener">Photo: Marek Piwnicki, Unsplash</a>
  </nav>
  <section class="list" aria-label="Jobs">
    <div class="list-head"><h1 id="l-title">New</h1><p id="l-sub"></p></div>
    <div class="rows" id="rows" role="listbox" aria-label="Job list" tabindex="0"></div>
  </section>
  <main class="detail">
    <div class="toolbar">
      <label class="pill glass search"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="sr">Search</span><input id="q" type="search" placeholder="Search" autocomplete="off"></label>
    </div>
    <div id="detail"></div>
  </main>
</div>

<!-- iPhone -->
<div class="m">
  <h1>Job Radar</h1><p class="sub" id="m-sub"></p>
  <label class="msearch glass" id="msearch"><svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span class="sr">Search</span><input id="mq" type="search" placeholder="Search role or company" autocomplete="off"></label>
  <div class="seg glass" id="seg" role="group" aria-label="View"><span class="thumb" id="thumb"></span>
    <button data-v="new">New</button><button data-v="applied">Applied</button><button data-v="all">All</button></div>
  <div class="chips" id="m-roles" aria-label="Role"></div>
  <div class="chips" id="m-locs" aria-label="Location"></div>
  <button class="clear mclear" id="m-clear" hidden>Clear filters</button>
  <div id="m-list"></div>
  <button class="sw msw" role="switch" aria-checked="false" id="m-other"><span>Show other titles</span><span class="switch"></span></button>
  <div class="mfoot" id="m-foot"></div>
</div>
<div class="fade"></div>
<nav class="tabbar glass" aria-label="Sections">
  <button class="tab" aria-pressed="true" data-tab="radar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg>Radar</button>
  <button class="tab" aria-pressed="false" data-tab="applied"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Applied</button>
  <button class="tab" aria-pressed="false" data-tab="funding"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>Funding</button>
</nav>
<button class="fab glass" id="fab" aria-label="Search"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
<div class="toast glass" id="toast" role="status"></div>
<div id="sheetwrap"><div class="scrim" id="scrim"></div><div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-label="Job details"></div></div>

<script>
const $=id=>document.getElementById(id);
const BOARD={hn:"Hacker News",yc:"YC",a16z:"a16z",trueup:"Lenny's Jobs",vc:"VC Boards",ats:"Career Pages",remoteok:"Remote OK",remotive:"Remotive",himalayas:"Himalayas",wwr:"We Work Remotely"};
const LOCS=["India","US","Remote","Other"];
const S={view:"new",role:"",loc:"",board:"",q:"",other:false,sel:null,sheet:null,fregion:"",fround:"",fsel:null};
let DATA={jobs:[],health:[],funding:[],funding_health:[]},lastVisit=null,mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const applied=()=>store.get("radar_applied",{});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=j=>j.posted_at||j.first_seen_at;
const hrs=iso=>iso?(Date.now()-new Date(iso))/36e5:null;
function short(iso){const h=hrs(iso);if(h==null)return"—";if(h<1)return Math.max(1,Math.round(h*60))+"m";if(h<24)return Math.round(h)+"h";return Math.round(h/24)+"d"}
function long(iso){const h=hrs(iso);if(h==null)return"Date unknown";if(h<1){const m=Math.max(1,Math.round(h*60));return m+(m===1?" minute ago":" minutes ago")}
  if(h<24){const r=Math.round(h);return r+(r===1?" hour ago":" hours ago")}const d=Math.round(h/24);return d===1?"Yesterday":d+" days ago"}
function dayOf(iso){if(!iso)return"Date Unknown";const d=new Date(iso),t=new Date();t.setHours(0,0,0,0);
  const n=Math.round((t-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  if(n<=0)return"Today";if(n===1)return"Yesterday";if(n<7)return d.toLocaleDateString(undefined,{weekday:"long"});return"Earlier"}
const clock=iso=>iso?new Date(iso).toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"}):"—";
const hot=j=>{const h=hrs(when(j));return h!=null&&h<12};
const isNew=(j,ap)=>j.status==="new"&&!ap[j.id];
const fresh=(j,ap)=>lastVisit&&j.first_seen_at>lastVisit&&!ap[j.id];
const isF=()=>S.view==="funding";
const filtering=()=>isF()?(S.q||S.fregion||S.fround):(S.q||S.role||S.loc||S.board);

/* ---------- funding ---------- */
const fwhen=f=>f.published_at||f.first_seen_at;
const roundGroup=r=>{if(!r)return"Other";const x=r.toLowerCase();if(x.includes("pre-seed")||x==="angel")return"Pre-Seed";if(x==="seed")return"Seed";
  if(x.includes("pre-series"))return"Pre-Series A";const m=x.match(/series ([a-h])/);if(m)return m[1]==="a"?"Series A":m[1]==="b"?"Series B":"Series C+";return"Other"};
const ROUNDS=["Pre-Seed","Seed","Pre-Series A","Series A","Series B","Series C+","Other"];
function fmatch(f,skip){const q=S.q.toLowerCase();
  return (skip==="fregion"||!S.fregion||f.region===S.fregion)&&(skip==="fround"||!S.fround||roundGroup(f.round)===S.fround)
    &&(!q||(f.company||"").toLowerCase().includes(q)||(f.headline||"").toLowerCase().includes(q))}
function frows(){return(DATA.funding||[]).filter(f=>fmatch(f)).sort((a,b)=>String(fwhen(b)).localeCompare(String(fwhen(a))))}
const fhot=f=>{const h=hrs(fwhen(f));return h!=null&&h<24};
const fsite=f=>f.website||("https://www.google.com/search?q="+encodeURIComponent(f.company+" official website"));
function fstatus(){const n=(DATA.funding||[]).filter(f=>hrs(fwhen(f))<168).length;
  return DATA.generated_at?`${n} funding ${n===1?"story":"stories"} this week. Updated ${long(DATA.generated_at).toLowerCase()}`:"Waiting for the first scan"}
function fhealth(){const h=DATA.funding_health||[];return h.length?"Sources: "+h.map(s=>s.ok?esc(s.source):`<span class="bad">${esc(s.source)} failed</span>`).join(", "):""}
function fdetailHTML(f,sheet){
  if(!f)return sheet?"":`<div class="empty" style="height:70vh"><div><h2>No Story Selected</h2><p>Choose a funding story to see the details.</p></div></div>`;
  return`<div class="detail-inner">${sheet?'<div class="grab"></div><button class="done-btn" data-close>Done</button>':""}
    <div class="${sheet?"":"hero"}">
      <div class="d-co">Funding news from ${esc(f.source||"the web")}</div>
      <h2 class="d-title">${esc(f.company)}</h2>
      <div class="d-sub">Raised ${f.amount?`<b class="amt">${esc(f.amount)}</b>`:"funding"}${f.round?" in a "+esc(f.round)+" round":""}. Reported <span class="${fhot(f)?"hot":""}">${long(fwhen(f)).toLowerCase()}</span>.</div>
      ${(f.founders||[]).length?`<p class="fnames"><span>Founders</span>${f.founders.map(esc).join(", ")}</p>`:""}
      <p class="headline">${esc(f.headline)}</p>
      <div class="actions"><a class="btn primary" href="${esc(f.url)}" target="_blank" rel="noopener">Read News</a>
</div>
    </div>
    <div class="facts">
      <div class="fact"><small>Amount</small><span>${esc(f.amount||"Not stated")}</span></div>
      <div class="fact"><small>Round</small><span>${esc(f.round||"Not stated")}</span></div>
      <div class="fact"><small>Region</small><span>${esc(f.region||"Global")}</span></div>
</div></div>`}
function renderFundList(){const rows=frows();
  $("l-title").textContent="Funding";$("l-sub").textContent=fstatus();
  if(!rows.find(f=>f.id===S.fsel))S.fsel=rows[0]?.id??null;
  let h="",g=null;
  for(const f of rows){const d=dayOf(fwhen(f));if(d!==g){g=d;h+=`<div class="day">${d}</div>`}
    h+=`<button class="row" role="option" data-fid="${f.id}" aria-selected="${f.id===S.fsel}">
      <div class="r1"><b>${esc(f.company)}</b><span class="age ${fhot(f)?"hot":""}">${short(fwhen(f))}</span></div>
      <div class="r2">${esc([f.amount,f.round].filter(Boolean).join(" ")||"Funding round")}</div>
      <div class="r3">${esc(f.source||"")} — ${esc(f.region||"Global")}</div></button>`}
  $("rows").innerHTML=h||`<div class="empty"><div><h2>${filtering()?"No Results":"No Funding News Yet"}</h2><p>${filtering()?"Try another search or clear a filter.":"Stories appear after the next scan."}</p></div></div>`;
}
function renderFundSide(){const pool=DATA.funding||[];
  const cnt=(k,v)=>pool.filter(f=>fmatch(f,k)&&(k==="fregion"?f.region===v:roundGroup(f.round)===v)).length;
  $("s-fregion").innerHTML=["India","Global"].map(r=>sideItem("fregion",r,r,cnt("fregion",r))).join("");
  $("s-fround").innerHTML=ROUNDS.filter(r=>r!=="Other"||cnt("fround",r)).map(r=>sideItem("fround",r,r,cnt("fround",r))).join("");
}

function base(ap){return DATA.jobs.filter(j=>S.view==="applied"?ap[j.id]:S.view==="new"?isNew(j,ap):true)
  .filter(j=>S.other||j.tag||S.view==="applied")}
const inLoc=(j,l)=>(","+(j.location_group||"")+",").includes(","+l+",");
function matches(j,skip){const q=S.q.toLowerCase();
  return (skip==="role"||!S.role||j.tag===S.role)&&(skip==="board"||!S.board||j.source===S.board)
    &&(skip==="loc"||!S.loc||inLoc(j,S.loc))
    &&(!q||(j.title||"").toLowerCase().includes(q)||(j.company||"").toLowerCase().includes(q))}
function filtered(){const ap=applied();
  return base(ap).filter(j=>matches(j))
    .sort((a,b)=>String(when(b)).localeCompare(String(when(a)))).slice(0,600)}
function counts(){const ap=applied(),m=j=>matches(j);
  return{new:DATA.jobs.filter(j=>isNew(j,ap)&&(j.tag||S.other)&&m(j)).length,applied:DATA.jobs.filter(j=>ap[j.id]&&m(j)).length,
    all:DATA.jobs.filter(j=>(j.tag||S.other)&&m(j)).length}}
function statusLine(){const ap=applied(),since=DATA.jobs.filter(j=>j.tag&&isNew(j,ap)&&fresh(j,ap)).length;
  return DATA.generated_at?`${since?since+" new since your last visit. ":""}Updated ${long(DATA.generated_at).toLowerCase()}`:"Waiting for the first scan"}
function health(){return DATA.health.length?"Boards: "+DATA.health.map(s=>s.ok?esc(BOARD[s.source]||s.source):`<span class="bad">${esc(BOARD[s.source]||s.source)} failed</span>`).join(", "):""}
const emptyCopy=()=>filtering()?["No Results","Try another search or clear a filter."]:
  {new:DATA.show_from&&new Date(DATA.show_from)>new Date()?["Starting Fresh Tomorrow","Old jobs are cleared. New matches show up from the 9 AM scan."]:["You're All Caught Up","New matches appear after the next scan, around 9 AM and 9 PM."],applied:["No Applications Yet","Mark a job as applied and it shows up here."],all:["No Jobs Yet","Jobs appear after the first scan."]}[S.view];

/* ---------- desktop ---------- */
const ICON={new:'<path d="M3 13.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4.5M3 13.5 5.6 5.4A2 2 0 0 1 7.5 4h9a2 2 0 0 1 1.9 1.4l2.6 8.1M3 13.5h5l1.5 2.5h5l1.5-2.5h5"/>',
  applied:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.6"/>',
  all:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6" fill="currentColor"/><circle cx="4" cy="12" r=".6" fill="currentColor"/><circle cx="4" cy="18" r=".6" fill="currentColor"/>',
  funding:'<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>'};
function sideItem(group,val,label,count){const on=S[group]===val;
  const ic=group==="view"?`<svg class="sic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[val]}</svg>`:"";
  return`<button class="si ${count===0&&!on?"zero":""}" data-g="${group}" data-v="${esc(val)}" aria-pressed="${on}">${ic}${esc(label)}<span class="ct">${on&&group!=="view"?"✕":count??""}</span></button>`}
function renderSide(){const c=counts(),pool=base(applied());
  const cnt=(k,v)=>pool.filter(j=>matches(j,k)&&(k==="loc"?inLoc(j,v):k==="role"?j.tag===v:j.source===v)).length;
  $("s-views").innerHTML=sideItem("view","new","New",c.new)+sideItem("view","applied","Applied",c.applied)+sideItem("view","all","All Jobs",c.all)
    +sideItem("view","funding","Funding",(DATA.funding||[]).filter(f=>fmatch(f)).length);
  $("s-jobf").hidden=isF();$("s-fundf").hidden=!isF();if(isF())renderFundSide();
  $("s-roles").innerHTML=[...new Set(DATA.jobs.map(j=>j.tag).filter(Boolean))].sort().map(r=>sideItem("role",r,r,cnt("role",r))).join("");
  $("s-locs").innerHTML=LOCS.filter(l=>l!=="Other"||cnt("loc",l)).map(l=>sideItem("loc",l,l,cnt("loc",l))).join("");
  $("s-boards").innerHTML=[...new Set(DATA.jobs.map(j=>j.source))].sort().map(b=>sideItem("board",b,BOARD[b]||b,cnt("board",b))).join("");
  $("s-other").setAttribute("aria-checked",S.other);
  $("s-foot").innerHTML=isF()?fhealth():health();
  $("s-clear").hidden=!filtering();
}
function renderList(){if(isF())return renderFundList();const rows=filtered(),ap=applied();
  $("l-title").textContent={new:"New",applied:"Applied",all:"All Jobs"}[S.view];
  $("l-sub").textContent=statusLine();
  if(!rows.find(j=>j.id===S.sel))S.sel=rows[0]?.id??null;
  let h="",g=null;
  for(const j of rows){const d=dayOf(when(j));if(d!==g){g=d;h+=`<div class="day">${d}</div>`}
    const done=!!ap[j.id];
    h+=`<button class="row ${done?"done":""}" role="option" data-id="${j.id}" aria-selected="${j.id===S.sel}">
      ${fresh(j,ap)?'<span class="dot" aria-label="New since last visit"></span>':""}
      <div class="r1"><b>${esc(j.company)}</b><span class="age ${hot(j)?"hot":""}">${short(when(j))}</span></div>
      <div class="r2">${done?'<span class="check">✓</span>':""}${esc(j.title)}</div>
      <div class="r3">${esc(j.location||"Location not listed")}${j.tag?" — "+esc(j.tag):""}</div></button>`}
  const e=emptyCopy();
  $("rows").innerHTML=h||`<div class="empty"><div><h2>${e[0]}</h2><p>${e[1]}</p></div></div>`;
}
function detailHTML(j,sheet){
  if(!j)return sheet?"":`<div class="empty" style="height:70vh"><div><h2>No Job Selected</h2><p>Choose a job from the list to see its details.</p></div></div>`;
  const done=!!applied()[j.id];
  return`<div class="detail-inner">${sheet?'<div class="grab"></div><button class="done-btn" data-close>Done</button>':""}
    <div class="${sheet?"":"hero"}">
      <div class="d-co">${esc(j.company)} on ${esc(BOARD[j.source]||j.source)}</div>
      <h2 class="d-title">${esc(j.title)}</h2>
      <div class="d-sub">${esc(j.location||"Location not listed")}. Posted <span class="${hot(j)?"hot":""}">${long(when(j)).toLowerCase()}</span>.</div>
      <div class="actions"><a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Open Job</a>
        <button class="btn glass ${done?"done":""}" data-apply="${j.id}">${done?"✓ Applied":"Mark as Applied"}</button>
        <button class="btn glass" data-tailor="${j.id}">Tailor CV</button>
</div>
    </div>
    <div class="facts">
      <div class="fact"><small>Role type</small><span>${esc(j.tag||"Other")}</span></div>
      <div class="fact"><small>Region</small><span>${esc((j.location_group||"Other").replace(/,/g,", "))}</span></div>
      <div class="fact"><small>Board</small><span>${esc(BOARD[j.source]||j.source)}</span></div>
      <div class="fact"><small>First seen</small><span>${clock(j.first_seen_at)}</span></div></div>
    ${j.possible_dupe_of?'<p class="note">This role is also listed on another board.</p>':""}
    ${jobExtras(j)}</div>`}
const initials=n=>(n||"?").replace(/[^A-Za-z ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const meter=(label,v)=>`<div class="gm"><span class="gm-l">${label}</span><span class="gm-bar"><i style="width:${Math.max(4,v||0)}%"></i></span><span class="gm-v">${v==null?"—":v+"%"}</span></div>`;
const LI='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.5 8.8H3.6V20h2.9V8.8zM5 4a1.7 1.7 0 1 0 0 3.4A1.7 1.7 0 0 0 5 4zm15 9.6c0-3-1.6-4.9-4.2-4.9-1.4 0-2.4.7-2.9 1.5V8.8H10V20h2.9v-5.9c0-1.5.6-2.6 2-2.6 1.3 0 2 .9 2 2.6V20H20v-6.4z"/></svg>';
function jobExtras(j){const d=j.d;
  if(!d)return`<p class="note">People and the job description appear after the next scan.</p>`;
  if(d.error&&!d.people?.length)return`<p class="note">Couldn't read this job page (${esc(d.error)}). Use Open Job instead.</p>`;
  const people=(d.people||[]).map((p,i)=>{
    const link=p.linkedin?`<a class="pill-btn" href="${esc(p.linkedin)}" target="_blank" rel="noopener" aria-label="LinkedIn">${LI}<span>Profile</span></a>`
      :p.search?`<a class="pill-btn" href="${esc(p.search)}" target="_blank" rel="noopener">${LI}<span>Find</span></a>`:"";
    const mail=p.email?`<a class="pill-btn blue" href="mailto:${esc(p.email)}">Email</a>`:"";
    return`<div class="prow"><span class="av ${p.role==="Founder"?"av-f":p.role==="HR"?"av-h":p.role==="Hiring manager"?"av-m":"av-e"}">${p.email&&!p.linkedin&&p.role==="From the post"?"@":esc(initials(p.name))}</span>
      <div class="pinfo"><div class="pname">${esc(p.name)} <span class="role">${esc(p.role)}</span></div><div class="ptitle">${esc(p.title||"")}</div>
        <div class="meters">${meter("Worth emailing",p.need)}${meter("Email findable",p.exists)}</div></div>
      <div class="pact">${mail}${link}</div></div>`}).join("");
  const c=d.company||{},facts=[c.website?`<a href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website.replace(/^https?:\/\//,"").replace(/\/$/,""))}</a>`:"",
    c.team_size?`${c.team_size} people`:"",c.batch?`YC ${esc(c.batch)}`:""].filter(Boolean);
  return`<section class="sec"><h3>Outreach</h3><div class="glist pad">
      <div class="need"><div class="need-v">${d.need??"—"}<small>%</small></div><div><div class="need-t">Worth emailing someone directly</div>
      <ul class="why">${(d.why||[]).map(w=>`<li>${esc(w)}</li>`).join("")||"<li>No strong signal either way. Applying normally is fine.</li>"}</ul></div></div></div></section>
    <section class="sec"><h3>People</h3><div class="glist">${people||'<div class="prow"><div class="ptitle">No people found yet.</div></div>'}</div>
      <button class="btn glass wide" data-getemails="${j.id}">Get Emails from Claude</button>
      <p class="hint">Copies a request. Paste it in your Claude chat and pick who's worth a credit.</p></section>
    ${facts.length?`<section class="sec"><h3>Company</h3><div class="glist pad facts-line">${facts.join('<span class="dot-sep"></span>')}</div></section>`:""}
    ${d.description?`<section class="sec"><h3>About the Role</h3><div class="glist pad desc" id="desc-${j.id}">${esc(d.description)}</div>
      <button class="more" data-more="${j.id}">Show More</button></section>`:""}`}
function emailRequest(j){const d=j.d||{},ppl=(d.people||[]).filter(p=>p.role!=="From the post");
  return`Get emails for ${j.company} (${j.title}). Job: ${j.url}\n`+ppl.map(p=>`- ${p.role}: ${p.name}${p.title?" ("+p.title+")":""}${p.linkedin?" "+p.linkedin:""} [worth ${p.need}%, findable ${p.exists}%]`).join("\n")}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(_){ }a.remove();return ok}}
function renderDetail(){$("detail").innerHTML=isF()?fdetailHTML((DATA.funding||[]).find(f=>f.id===S.fsel),false):detailHTML(DATA.jobs.find(j=>j.id===S.sel),false)}

/* ---------- phone ---------- */
function renderPhone(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t.dataset.tab===(isF()?"funding":S.view==="applied"?"applied":"radar")));
  $("seg").hidden=isF();$("m-other").hidden=isF();$("mq").placeholder=isF()?"Search company":"Search role or company";
  if(isF())return renderFundPhone();
  const rows=filtered(),ap=applied(),c=counts();
  $("m-sub").textContent=statusLine();
  $("thumb").style.transform=`translateX(${["new","applied","all"].indexOf(S.view)*100}%)`;
  document.querySelectorAll(".seg button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.v===S.view);
    b.textContent={new:"New",applied:"Applied",all:"All"}[b.dataset.v]+(c[b.dataset.v]&&b.dataset.v!=="all"?` (${c[b.dataset.v]})`:"")});
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t.dataset.tab===(S.view==="applied"?"applied":"radar")));
  const roles=[...new Set(DATA.jobs.map(j=>j.tag).filter(Boolean))].sort();
  const chip=(g,v,l)=>`<button class="chip ${S[g]===v?"":"glass"}" data-g="${g}" data-v="${esc(v)}" aria-pressed="${S[g]===v}">${esc(l)}</button>`;
  $("m-roles").innerHTML=chip("role","","All Roles")+roles.map(r=>chip("role",r,r)).join("");
  $("m-locs").innerHTML=chip("loc","","Anywhere")+LOCS.map(l=>chip("loc",l,l)).join("");
  let h="",g=null,open=false;
  for(const j of rows){const d=dayOf(when(j));if(d!==g){if(open)h+="</div>";g=d;h+=`<div class="gh">${d}</div><div class="grp">`;open=true}
    const done=!!ap[j.id];
    h+=`<button class="mrow ${done?"done":""}" data-open="${j.id}"><span class="mdot ${done?"done":fresh(j,ap)?"on":""}"></span>
      <span class="mtx"><span class="gm">${esc(j.title)}</span><span class="ms">${esc(j.company)}, ${esc(j.location||"location not listed")}</span></span>
      <span class="mage ${hot(j)?"hot":""}">${short(when(j))}</span><span class="chev">›</span></button>`}
  if(open)h+="</div>";
  const e=emptyCopy();
  $("m-list").innerHTML=h||`<div class="empty"><div><h2>${e[0]}</h2><p>${e[1]}</p></div></div>`;
  $("m-other").setAttribute("aria-checked",S.other);
  $("m-clear").hidden=!filtering();
  $("m-foot").innerHTML=health();
}
function renderFundPhone(){const rows=frows();
  $("m-sub").textContent=fstatus();
  const chip=(g,v,l)=>`<button class="chip ${S[g]===v?"":"glass"}" data-g="${g}" data-v="${esc(v)}" aria-pressed="${S[g]===v}">${esc(l)}</button>`;
  $("m-roles").innerHTML=chip("fregion","","Everywhere")+chip("fregion","India","India")+chip("fregion","Global","Global");
  $("m-locs").innerHTML=chip("fround","","All Rounds")+ROUNDS.filter(r=>r!=="Other").map(r=>chip("fround",r,r)).join("");
  let h="",g=null,open=false;
  for(const f of rows){const d=dayOf(fwhen(f));if(d!==g){if(open)h+="</div>";g=d;h+=`<div class="gh">${d}</div><div class="grp">`;open=true}
    h+=`<button class="mrow" data-fopen="${f.id}"><span class="mdot"></span>
      <span class="mtx"><span class="gm">${esc(f.company)}</span><span class="ms">${esc([f.amount,f.round].filter(Boolean).join(" "))}${f.source?", "+esc(f.source):""}</span></span>
      <span class="mage ${fhot(f)?"hot":""}">${short(fwhen(f))}</span><span class="chev">›</span></button>`}
  if(open)h+="</div>";
  $("m-list").innerHTML=h||`<div class="empty"><div><h2>${filtering()?"No Results":"No Funding News Yet"}</h2><p>${filtering()?"Try another search or clear a filter.":"Stories appear after the next scan."}</p></div></div>`;
  $("m-clear").hidden=!filtering();$("m-foot").innerHTML=fhealth();
}
function openFSheet(id){S.sheet="f"+id;$("sheet").innerHTML=fdetailHTML((DATA.funding||[]).find(f=>f.id===id),true);$("sheetwrap").classList.add("open")}
function openSheet(id){S.sheet=id;$("sheet").innerHTML=detailHTML(DATA.jobs.find(j=>j.id===id),true);$("sheetwrap").classList.add("open")}
function closeSheet(){$("sheetwrap").classList.remove("open");S.sheet=null}
let tt;function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}

function render(){renderSide();renderList();renderDetail();renderPhone()}

/* ---------- actions ---------- */
function toggleApplied(id){const ap=applied();id=String(id);
  const leaving=!ap[id]&&S.view==="new";
  if(ap[id])delete ap[id];else ap[id]=1;store.set("radar_applied",ap);
  const row=document.querySelector(`.row[data-id="${id}"]`);
  if(leaving&&row&&row.offsetParent&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    const ids=filtered().map(j=>String(j.id)),i=ids.indexOf(id);
    row.classList.add("leaving");setTimeout(()=>{S.sel=Number(ids[i+1]||ids[i-1])||null;render()},360);
  } else render();
  if(S.sheet)$("sheet").innerHTML=detailHTML(DATA.jobs.find(j=>j.id===S.sheet),true);
}
document.addEventListener("click",e=>{
  const si=e.target.closest(".si,.chip");
  if(si){const g=si.dataset.g,v=si.dataset.v;S[g]=g==="view"?v:(S[g]===v&&v!==""?"":v);S.sel=null;render();return}
  const r=e.target.closest(".row");if(r){if(r.dataset.fid)S.fsel=Number(r.dataset.fid);else S.sel=Number(r.dataset.id);renderList();renderDetail();return}
  const ge=e.target.closest("[data-getemails]");if(ge){const j=DATA.jobs.find(x=>String(x.id)===ge.dataset.getemails);
    if(j)copyText(emailRequest(j)).then(ok=>toast(ok?"Copied. Paste it in your Claude chat.":"Couldn't copy. Select the text manually."));return}
  const mo2=e.target.closest("[data-more]");if(mo2){const el=document.getElementById("desc-"+mo2.dataset.more);if(el){el.classList.toggle("open");mo2.textContent=el.classList.contains("open")?"Show Less":"Show More"}return}
  const fo=e.target.closest("[data-fopen]");if(fo){openFSheet(Number(fo.dataset.fopen));return}
  const ap=e.target.closest("[data-apply]");if(ap){toggleApplied(ap.dataset.apply);return}
  const mo=e.target.closest("[data-open]");if(mo){openSheet(Number(mo.dataset.open));return}
  const seg=e.target.closest(".seg button");if(seg){S.view=seg.dataset.v;render();return}
  const tab=e.target.closest(".tab");if(tab){
    S.view=tab.dataset.tab==="funding"?"funding":tab.dataset.tab==="applied"?"applied":"new";render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(e.target.closest("#fab")){const s=$("msearch");s.classList.toggle("show");if(s.classList.contains("show")){window.scrollTo({top:0,behavior:"smooth"});$("mq").focus()}return}
  if(e.target.closest("#s-other,#m-other")){S.other=!S.other;render();return}
  if(e.target.closest(".clear")){S.role=S.loc=S.board=S.q=S.fregion=S.fround="";$("q").value=$("mq").value="";S.sel=null;render();return}
  if(e.target.id==="scrim"||e.target.closest("[data-close]"))closeSheet();
});
for(const id of["q","mq"])$(id).addEventListener("input",e=>{S.q=e.target.value;$(id==="q"?"mq":"q").value=S.q;render()});
document.addEventListener("keydown",e=>{
  if(document.body.classList.contains("studio-open")||e.target.isContentEditable||e.target.tagName==="TEXTAREA")return;
  if(e.key==="Escape"&&S.sheet){closeSheet();return}
  if(matchMedia("(max-width:899px)").matches)return;
  if(e.target.tagName==="INPUT"){if(e.key==="Escape"||e.key==="Enter")e.target.blur();return}
  if(isF()){const ids=frows().map(f=>f.id),i=ids.indexOf(S.fsel),f=(DATA.funding||[]).find(x=>x.id===S.fsel);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();S.fsel=ids[Math.min(ids.length-1,Math.max(0,i+(e.key==="ArrowDown"?1:-1)))];
      renderList();renderDetail();document.querySelector(".row[aria-selected=true]")?.scrollIntoView({block:"nearest"})}
    else if(e.key==="Enter"&&f)window.open(f.url,"_blank","noopener");
    else if(e.key==="/"){e.preventDefault();$("q").focus()}
    return}
  const ids=filtered().map(j=>j.id),i=ids.indexOf(S.sel);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();S.sel=ids[Math.min(ids.length-1,Math.max(0,i+(e.key==="ArrowDown"?1:-1)))];
    renderList();renderDetail();document.querySelector(".row[aria-selected=true]")?.scrollIntoView({block:"nearest"})}
  else if(e.key==="Enter"&&S.sel!=null){const j=DATA.jobs.find(x=>x.id===S.sel);if(j)window.open(j.url,"_blank","noopener")}
  else if((e.key==="a"||e.key==="A")&&S.sel!=null&&!e.metaKey&&!e.ctrlKey)toggleApplied(S.sel);
  else if((e.key==="e"||e.key==="E")&&S.sel!=null&&!e.metaKey&&!e.ctrlKey){const j=DATA.jobs.find(x=>x.id===S.sel);if(j?.d)copyText(emailRequest(j)).then(ok=>toast(ok?"Copied. Paste it in your Claude chat.":"Couldn't copy."))}
  else if(e.key==="/"){e.preventDefault();$("q").focus()}
});

async function load(){
  lastVisit=store.get("radar_last_visit",null);
  try{DATA=await(await fetch("jobs.json?t="+Date.now())).json()}
  catch(e){$("l-sub").textContent=$("m-sub").textContent="Couldn't load the job list. Run the Job Radar workflow on GitHub once, then refresh.";return}
  render();
  store.set("radar_last_visit",DATA.generated_at||new Date().toISOString());
}
load();
</script>

<script>

fs, Semrush"}]}, {"title": "Education", "lines": [{"t": "h", "text": "B.Tech, Dairy Technology | Maharana Pratap University of Agriculture and Technology, Udaipur | 2021 – 2025"}, {"t": "p", "text": "CGPA 6.2"}, {"t": "h", "text": "Senior Secondary | St. Anselm's Sr. Sec. School, Ajmer"}, {"t": "p", "text": "75.2%"}, {"t": "h", "text": "Matriculation | St. Anselm's Sr. Sec. School, Ajmer"}, {"t": "p", "text": "71.4%"}]}]};

const AIWORDS=["spearheaded","leveraged","leveraging","synergy","synergies","utilize","utilized","delve","passionate","results-driven","dynamic","seamless","seamlessly","robust",

 "kindly","i would like to express","please find attached","pick your brain","just checking in","circling back","touch base"];
const VERBS=new Set("built led ran grew cut won made wrote drove set sold taught brought found took got gave kept put rose hit shipped began chose drew held lent met paid sent spent spoke stood told understood".split(" "));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const kwRe=k=>new RegExp("(^|[^A-Za-z0-9])"+reEsc(k)+"(?![A-Za-z0-9])","i");
const T={mode:null,id:null,raw:false,person:0,focus:null,follow:false,marks:true};

/* ---- CV model: {name,contact,sections:[{title,lines:[{t:'p'|'h'|'b',text}]}]} ---- */
const clone=o=>JSON.parse(JSON.stringify(o));
function baseCV(){return store.get("radar_cv",DEFAULT_CV)}
function jobCVs(){return store.get("radar_cvjobs",{})}
function getCV(id){return jobCVs()[id]||(baseCV()?clone(baseCV()):null)}
function putCV(id,m){const all=jobCVs();all[id]=m;store.set("radar_cvjobs",all)}
function cvToText(m){if(!m)return"";let o=[m.name,...(m.headline?[m.headline]:[]),m.contact];for(const s of m.sections){o.push("","# "+s.title);
  for(const l of s.lines)o.push(l.t==="b"?"- "+l.text:l.t==="h"?"## "+l.text:l.text)}return o.join("\n").trim()}
function textToCV(t){const L=t.replace(/\r/g,"").split("\n").map(x=>x.trim());
  const HEAD=/^(summary|profile|about|objective|experience|work experience|professional experience|internships?|education|skills|technical skills|projects|certifications?|achievements|awards|leadership|activities|volunteering|languages|interests|positions of responsibility)$/i;
  const lines=L.filter(Boolean),m={name:"",contact:"",sections:[]};let cur=null,i=0;
  if(lines[0]&&!lines[0].startsWith("#")){m.name=lines[0];i=1}
  const isCt=x=>x&&!x.startsWith("#")&&!HEAD.test(x)&&/[@|·•]|\d{5}|linkedin|http/i.test(x);
  if(!isCt(lines[i])&&isCt(lines[i+1])&&lines[i]&&!lines[i].startsWith("#")&&!HEAD.test(lines[i])){m.headline=lines[i];i++}
  if(isCt(lines[i])){m.contact=lines[i];i++}
  for(;i<lines.length;i++){let x=lines[i];
    if(x.startsWith("## ")){(cur||(cur=add("Experience"))).lines.push({t:"h",text:x.slice(3).trim()});continue}
    if(x.startsWith("# ")||HEAD.test(x.replace(/:$/,""))||(/^[A-Z][A-Z &/]{3,}$/.test(x)&&x.length<40)){cur=add(x.replace(/^#\s*/,"").replace(/:$/,""));continue}
    if(!cur)cur=add("Summary");
    if(/^[-•*–▪●]\s*/.test(x)){cur.lines.push({t:"b",text:x.replace(/^[-•*–▪●]\s*/,"")});continue}
    const prevB=cur.lines.length&&cur.lines[cur.lines.length-1].t==="b",next=lines[i+1]||"";
    cur.lines.push({t:(/\|/.test(x)||(/^[-•*–▪●]/.test(next)&&x.length<110&&!prevB&&!/[.]$/.test(x)))?"h":"p",text:x})}
  function add(title){const s={title:title.charAt(0).toUpperCase()+title.slice(1).toLowerCase(),lines:[]};m.sections.push(s);return s}
  return m}
function cvPlain(m){return m?[m.name,m.headline||"",m.contact,...m.sections.flatMap(s=>[s.title,...s.lines.map(l=>l.text)])].join("\n"):""}

/* ---- analysis ---- */
function jdOf(j){return(j.d&&j.d.description)||store.get("radar_jd",{})[j.id]||""}
function jdKeywords(jd){const out=[];for(const k of KW){const n=(jd.match(new RegExp("(^|[^A-Za-z0-9])"+reEsc(k)+"(?![A-Za-z0-9])","gi"))||[]).length;if(n)out.push([k,n])}
  return out.sort((a,b)=>b[1]-a[1]).slice(0,16).map(x=>x[0])}
const STOP=new Set("about above after again their there these those which while with within would should could your you have will from that this they them what when where were been being into more most other some such than then very also able work team role strong good great using use".split(" "));
function requirements(jd){const lines=jd.split(/\n|(?<=[.;])\s+(?=[A-Z])/).map(x=>x.replace(/^[•\-*\s]+/,"").trim()).filter(x=>x.length>18&&x.length<260);
  const RQ=/(experience|you have|you are|must|able to|ability|proficien|familiar|knowledge|comfortable|strong|skills?|years?|degree|understanding|background in|track record)/i;
  let r=lines.filter(x=>RQ.test(x));return[...new Set(r)].slice(0,7)}
function reqStatus(req,cvtxt){const low=cvtxt.toLowerCase();
  let words=KW.filter(k=>kwRe(k).test(req));
  if(!words.length)words=[...new Set((req.toLowerCase().match(/[a-z][a-z-]{4,}/g)||[]).filter(w=>!STOP.has(w)))].slice(0,6);
  if(!words.length)return["part",[]];
  const miss=words.filter(w=>!kwRe(w).test(low)),cov=1-miss.length/words.length;
  return[cov>=.6?"ok":cov>=.25?"part":"gap",miss]}
function xyz(text){const w=(text.trim().split(/\s+/)[0]||"").toLowerCase().replace(/[^a-z]/g,"");
  return{x:/ed$/.test(w)||VERBS.has(w),y:/(?<![A-Za-z])\d|%|₹|\$|\bdoubled?\b|\btripled?\b|\bhalf\b/i.test(text),z:/\b(by|through|using|via|with|after|across|leveraging)\b/i.test(text)}}
const FAM=[["email marketing","lifecycle","cold email","outreach","outbound","newsletter","CRM","HubSpot"],
  ["content marketing","blog","SEO","technical SEO","AEO","GEO","copywriting","writing","landing pages","backlinks","Ahrefs","Semrush","keyword research"],
  ["paid ads","Google Ads","performance marketing","Meta Ads","SEM","CTR","conversion","campaigns","ROI","CAC"],
  ["analytics","dashboards","SQL","Google Analytics","GA4","metrics","A/B testing","experimentation","Excel","data analysis","KPIs"],
  ["lead generation","leads","lead gen","pipeline","Apollo","Smartlead","demand generation","B2B","sales","outbound","Clay"],
  ["AI","LLM","automation","Claude","ChatGPT","n8n","Zapier","Apify","prompt engineering","APIs","technical"],
  ["NPD","product development","FMCG","food","research","market research"]];
function verdict(text,a){const r=xyz(text),low=text.toLowerCase(),ai=AIWORDS.filter(w=>low.includes(w));
  const their=a.kws.filter(k=>kwRe(k).test(text)),mine=KW.filter(k=>kwRe(k).test(text));
  if(ai.length||/—/.test(text))return["fix","Fix wording",ai.length?`Swap "${ai[0]}" for a plain verb.`:"Swap the long dash (—) for a comma or full stop. Reads less like AI."];
  if(!a.kws.length)return["keep","Keep",""];
  if(!their.length&&!mine.length)return["move","Move down or cut","Not related to this job. Move it lower or drop it."];
  if(!r.y)return["change","Change","Add a number: how many, how much, or how fast."];
  if(!their.length){const fam=FAM.filter(f=>f.some(k=>mine.includes(k))).flat();
    const miss=[...new Set(a.kws.filter(k=>!a.found.includes(k)&&fam.includes(k)))].slice(0,2);
    if(miss.length)return["modify","Modify",`Close to what they want. Use their words if true: ${miss.join(", ")}.`]}
  return["keep","Keep",""]}
function xyzHint(r){return!r.x?"Start with what you did: Built, Grew, Launched.":!r.y?"Add a number: how many, how much, how fast.":!r.z?"Say how: by doing what, using what.":""}
function humanScore(text){const low=text.toLowerCase(),hits=AIWORDS.filter(w=>low.includes(w));
  const dashes=(text.match(/—/g)||[]).length;return{score:Math.max(5,100-hits.length*12-Math.max(0,dashes-1)*5),hits,dashes}}
function analyse(j,m){const jd=jdOf(j),kws=jdKeywords(jd),txt=cvPlain(m);
  const found=kws.filter(k=>kwRe(k).test(txt));
  const bullets=m?m.sections.flatMap((s,si)=>s.lines.map((l,li)=>({...l,si,li})).filter(l=>l.t==="b")):[];
  const full=bullets.filter(b=>{const r=xyz(b.text);return r.x&&r.y&&r.z}).length;
  return{jd,kws,found,match:kws.length?Math.round(found.length/kws.length*100):0,bullets,full,human:humanScore(txt),reqs:requirements(jd).map(r=>[r,...reqStatus(r,txt)])}}
function hl(text,kws){let h=esc(text);if(!kws.length)return h;
  const re=new RegExp("(^|[^A-Za-z0-9])("+kws.slice().sort((a,b)=>b.length-a.length).map(k=>reEsc(esc(k))).join("|")+")(?![A-Za-z0-9])","gi");
  return h.replace(re,"$1<mark>$2</mark>")}

/* ---- studio shell ---- */
const job=()=>DATA.jobs.find(x=>String(x.id)===String(T.id));
function openStudio(mode,id,person){T.mode=mode;T.id=id;T.raw=false;T.person=person??0;T.follow=false;
  document.body.classList.add("studio-open");drawStudio()}
function closeStudio(){document.body.classList.remove("studio-open");T.mode=null;$("studio").innerHTML="";if(typeof render==="function")render()}
const ring=(v)=>{const c=2*Math.PI*15;return`<svg class="ring" viewBox="0 0 38 38"><circle class="bg" cx="19" cy="19" r="15"/><circle class="fg" cx="19" cy="19" r="15" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" transform="rotate(-90 19 19)"/></svg>`};
function drawStudio(){const j=job();if(!j)return closeStudio();$("studio").innerHTML=cvStudio(j);
}

/* ---- CV studio ---- */
function cvStudio(j){const m=getCV(j.id),a=analyse(j,m);
  return`<div class="st-bar glass"><div class="st-t"><b>Tailor CV for ${esc(j.title)}</b><span>${esc(j.company)}. Edits save for this job only.</span></div>
    <div class="st-stats" id="st-stats">${cvStats(a)}</div>
    <div class="st-act">${m&&!T.raw?`<button class="btn glass" data-st="marks">${T.marks?"Hide Marks":"Show Marks"}</button>`:""}${m?`<button class="btn glass" data-st="raw">${T.raw?"Done Editing Text":"Edit as Text"}</button>
      <button class="btn glass" data-st="claude">Ask Claude</button><button class="btn primary" data-st="pdf">Export PDF</button>`:""}
      <button class="x" data-st="close" aria-label="Close">✕</button></div></div>
  <div class="st-body"><aside class="st-col glass" id="st-left">${cvLeft(j,a)}</aside>
    <div class="st-mid"><div class="paper" id="paper">${paperHTML(j,m,a)}</div></div>
    <aside class="st-col glass st-r" id="st-right">${cvRight(j,m,a)}</aside></div>`}
function cvStats(a){return`<div class="stat">${ring(a.match)}<span><b>${a.match}%</b>keyword match</span></div>
  <div class="stat"><span><b>${a.full} of ${a.bullets.length}</b>XYZ bullets</span></div>
  <div class="stat"><span><b>${a.bullets.filter(b=>verdict(b.text,a)[0]!=="keep").length}</b>lines to fix</span></div>
  <div class="stat"><span><b>${a.human.score}%</b>sounds human</span></div>`}
function cvLeft(j,a){
  if(!a.jd)return`<div class="st-h">Job Description</div><p class="muted" style="margin-bottom:10px">This job page couldn't be read. Paste the description to get suggestions.</p>
    <textarea class="jd" id="jd-in" placeholder="Paste the job description"></textarea>`;
  return`<div class="st-h">What They Want</div><div>${a.reqs.map(([r,st,miss])=>`<div class="req"><span class="ri ${st}">${st==="ok"?"✓":st==="part"?"~":"!"}</span>
      <div>${esc(r.length>120?r.slice(0,118)+"…":r)}${st!=="ok"&&miss.length?`<small>Not in your CV: ${esc(miss.slice(0,3).join(", "))}</small>`:""}</div></div>`).join("")||'<p class="muted">No clear requirement lines found. Use the keywords below.</p>'}</div>
    <div class="st-h">Their Words</div><div class="kws">${a.kws.map(k=>`<span class="kw ${a.found.includes(k)?"on":""}">${esc(k)}</span>`).join("")||'<span class="muted">None found.</span>'}</div>
    <div class="st-h">Sounds Human?</div><div><div class="bar"><i style="width:${a.human.score}%"></i></div>
      <p class="flag">${a.human.hits.length?`Reads like AI: <b>${a.human.hits.map(esc).join(", ")}</b>. Swap for plain verbs.`:"No buzzwords found. Good."}${a.human.dashes>1?" Fewer long dashes.":""}</p></div>`}
function cvRight(j,m,a){if(!m)return`<div class="st-h">How This Works</div><p class="muted">Paste your CV once. Each job gets its own copy, so edits here never touch your main CV unless you choose Save as My CV.</p>`;
  const s=[];
  // per-line fixes are shown on the CV itself
  const miss=a.kws.filter(k=>!a.found.includes(k)).slice(0,4);
  if(miss.length)s.push(`<div class="sug"><b>Their words you don't use</b>${miss.map(esc).join(", ")}. Add one only where it's true for your work.</div>`);
  // move up: strongest bullet per role first
  m.sections.forEach((sec,si)=>{let start=-1;const groups=[];sec.lines.forEach((l,li)=>{if(l.t==="b"){if(start<0)start=li}else if(start>=0){groups.push([start,li]);start=-1}});
    if(start>=0)groups.push([start,sec.lines.length]);
    for(const[g0,g1]of groups){let best=g0,bs=-1;for(let k=g0;k<g1;k++){const sc=a.kws.filter(w=>kwRe(w).test(sec.lines[k].text)).length;if(sc>bs){bs=sc;best=k}}
      const first=a.kws.filter(w=>kwRe(w).test(sec.lines[g0].text)).length;
      if(best!==g0&&bs>first&&s.length<8)s.push(`<div class="sug"><b>Move up</b><q>${esc(sec.lines[best].text.slice(0,70))}…</q> matches this job best.<br><button class="pill-btn" data-st="up" data-si="${si}" data-li="${best}" data-to="${g0}">Move to Top</button></div>`)}});
  for(const[r,st]of a.reqs)if(st==="gap"&&s.length<10)s.push(`<div class="sug"><b>Gap</b>${esc(r.slice(0,90))}${r.length>90?"…":""}. Leave it, or mention a real project that comes close.</div>`);
  const FOODY=/\b(food|dairy|fmcg|cpg|nutrition|nutraceutical|beverage|agri|manufactur|quality|consumer goods|r&d|npd)\b/i;
  if(FOODY.test(a.jd)&&!m.sections.some(x=>x.title==="Other Internships"))s.unshift(`<div class="sug"><b>Related experience</b>This job fits your food and dairy background. Add Saras Dairy, NIFTEM-K and KVK internships?<br><button class="pill-btn" data-st="spare">Add to CV</button></div>`);
  return`<div class="st-h">Suggestions</div>${s.join("")||'<p class="muted">Looks strong. Read it once out loud before sending.</p>'}
    <div class="st-h" style="margin-top:22px">Your CV</div><p class="muted">This copy is for ${esc(j.company)}.</p>
    <div class="actions" style="margin-top:10px"><button class="pill-btn" data-st="savebase">Save as My CV</button><button class="pill-btn" data-st="reset">Reset to My CV</button></div>`}
function paperHTML(j,m,a){
  if(!m)return`<div class="p-empty"><h2>Add your CV</h2><p>Paste it as text. Lines starting with a dash become bullets. Headings like Experience and Education become sections.</p>
    <textarea id="cv-in" placeholder="Your Name&#10;email · phone · linkedin.com/in/you&#10;&#10;# Experience&#10;## Marketing Associate | Company | 2025 – Present&#10;- Grew newsletter signups 40% in 3 months by rewriting the welcome flow"></textarea>
    <button class="btn primary" data-st="import">Use This CV</button></div>`;
  if(T.raw)return`<textarea class="rawcv" id="rawcv" spellcheck="true">${esc(cvToText(m))}</textarea>`;
  const ed=(path,text,cls,tag="div")=>`<${tag} class="${cls}" contenteditable="true" spellcheck="true" data-p="${path}">${hl(text,a.kws)}</${tag}>`;
  return ed("name",m.name,"p-name")+(m.headline!=null?ed("headline",m.headline,"p-hl"):"")+ed("contact",m.contact,"p-ct")+m.sections.map((s,si)=>`<div class="p-sec">${ed(si+".t",s.title,"p-st")}
    ${s.lines.map((l,li)=>{const p=si+"."+li;if(l.t!=="b")return ed(p,l.text,l.t==="h"?"p-h":"p-p");const r=xyz(l.text),h=xyzHint(r);
      return`<div class="p-line v-${T.marks?verdict(l.text,a)[0]:"off"}" id="v-${si}-${li}"><div class="p-b">${ed(p,l.text,"")}<span class="xyz" id="x-${si}-${li}" title="X result · Y number · Z how"><i class="${r.x?"on":""}"></i><i class="${r.y?"on":""}"></i><i class="${r.z?"on":""}"></i></span></div>
      <div class="p-tag" id="h-${si}-${li}">${tagHTML(l.text,a,si,li)}</div></div>`}).join("")}
    <button class="addb" data-st="addb" data-si="${si}">+ Add bullet</button></div>`).join("")}
function tagHTML(text,a,si,li){if(!T.marks)return"";const[v,label,why]=verdict(text,a);
  if(v==="keep")return`<span class="tg tg-keep">✓ Keep</span>`;
  return`<span class="tg tg-${v}">${label}</span><span class="tw">${esc(why)}</span><button class="tq" data-st="askline" data-si="${si}" data-li="${li}">Ask Claude</button>`}
function setPath(m,p,v){if(p==="name")m.name=v;else if(p==="headline")m.headline=v;else if(p==="contact")m.contact=v;else{const[si,li]=p.split(".");if(li==="t")m.sections[si].title=v;else m.sections[si].lines[li].text=v}}
let saveT;
function cvEdited(el){const j=job(),m=getCV(j.id);setPath(m,el.dataset.p,el.innerText.replace(/\n+/g," ").trim());putCV(j.id,m);
  const[si,li]=el.dataset.p.split(".");const x=$(`x-${si}-${li}`);
  if(x){const r=xyz(m.sections[si].lines[li].text);x.innerHTML=`<i class="${r.x?"on":""}"></i><i class="${r.y?"on":""}"></i><i class="${r.z?"on":""}"></i>`;
    const a0=analyse(j,m),t=m.sections[si].lines[li].text;$(`h-${si}-${li}`).innerHTML=tagHTML(t,a0,si,li);$(`v-${si}-${li}`).className="p-line v-"+(T.marks?verdict(t,a0)[0]:"off")}
  clearTimeout(saveT);saveT=setTimeout(()=>{const a=analyse(j,getCV(j.id));$("st-stats").innerHTML=cvStats(a);$("st-left").innerHTML=cvLeft(j,a);$("st-right").innerHTML=cvRight(j,getCV(j.id),a)},350)}
function cvAskClaude(j){return`Look at the CV on this page. I'm applying for ${j.title} at ${j.company}.
List the 5 lines I should change most, each with one better version in the form "Accomplished X, measured by Y, by doing Z". Use only facts already in my CV, put [X] where I need to add a real number. No long dashes, no buzzwords. Keep the whole answer short.`}
function exportPDF(j){const m=getCV(j.id);const w=window.open("","_blank");if(!w){toast("Allow pop-ups to export the PDF.");return}
  const head=t=>{const parts=t.split(/\s+\|\s+/);const last=parts.length>1&&/(\d{4}|present|current)/i.test(parts[parts.length-1])?parts.pop():"";
    return`<div class="h"><span><b>${esc(parts[0]||"")}</b>${parts.length>1?", "+esc(parts.slice(1).join(", ")):""}</span><span>${esc(last)}</span></div>`};
  const body=m.sections.map(s=>{let h=`<h2>${esc(s.title)}</h2>`,open=false;
    for(const l of s.lines){if(l.t==="b"){if(!open){h+="<ul>";open=true}h+=`<li>${esc(l.text)}</li>`;continue}
      if(open){h+="</ul>";open=false}h+=l.t==="h"?head(l.text):`<p>${esc(l.text)}</p>`}
    return h+(open?"</ul>":"")}).join("");
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(m.name||"CV")} CV - ${esc(j.company)}</title><style>
  @page{size:A4;margin:14mm 16mm}*{box-sizing:border-box}body{font:10.5pt/1.4 Helvetica,Arial,sans-serif;color:#111;margin:0}
  h1{font-size:20pt;margin:0;font-weight:700}.ct{color:#444;font-size:9.5pt;margin:3px 0 4px}.hl{font-size:11pt;font-weight:600;margin-top:2px}
  h2{font-size:10.5pt;margin:12px 0 5px;padding-bottom:2px;border-bottom:1px solid #999;letter-spacing:.03em}
  .h{display:flex;justify-content:space-between;gap:12px;margin-top:6px}.h span:last-child{color:#444;white-space:nowrap}
  p{margin:2px 0}ul{margin:2px 0 0 16px;padding:0}li{margin:1px 0}</style></head>
  <body><h1>${esc(m.name)}</h1>${m.headline?`<div class="hl">${esc(m.headline)}</div>`:""}<div class="ct">${esc(m.contact)}</div>${body}<script>onload=()=>setTimeout(()=>print(),200)<\/script></body></html>`);w.document.close()}

function askClaude(t){copyText(t).then(ok=>toast(ok?"Copied. Open Claude (⌥C) and press ⌘V.":"Couldn't copy. Allow clipboard for this site."))}
/* ---- events ---- */
document.addEventListener("click",e=>{
  const op=e.target.closest("[data-tailor]");
  if(op){e.stopPropagation();openStudio("cv",op.dataset.tailor);return}
  const b=e.target.closest("[data-st]");if(!b||!T.mode)return;const j=job(),a=b.dataset.st;
  if(a==="close")return closeStudio();
  if(a==="import"){const t=$("cv-in").value.trim();if(!t)return toast("Paste your CV first.");const m=textToCV(t);store.set("radar_cv",m);putCV(j.id,clone(m));drawStudio();return toast("Saved as your CV.")}
  if(a==="raw"){if(T.raw){putCV(j.id,textToCV($("rawcv").value))}T.raw=!T.raw;return drawStudio()}
  if(a==="claude"){if(T.raw)putCV(j.id,textToCV($("rawcv").value));return askClaude(cvAskClaude(j))}
  if(a==="pdf"){if(T.raw)putCV(j.id,textToCV($("rawcv").value));return exportPDF(j)}
  if(a==="savebase"){store.set("radar_cv",clone(getCV(j.id)));return toast("Saved as your main CV.")}
  if(a==="reset"){const all=jobCVs();delete all[j.id];store.set("radar_cvjobs",all);drawStudio();return toast("Back to your main CV.")}
  if(a==="up"){const m=getCV(j.id),s=m.sections[b.dataset.si],[x]=s.lines.splice(Number(b.dataset.li),1);s.lines.splice(Number(b.dataset.to),0,x);putCV(j.id,m);return drawStudio()}
  if(a==="marks"){T.marks=!T.marks;return drawStudio()}
  if(a==="spare"){const m=getCV(j.id),ei=m.sections.findIndex(x=>x.title==="Experience");m.sections.splice(ei+1,0,clone(SPARE[0]));putCV(j.id,m);drawStudio();return toast("Added. Remove lines you don't need.")}
  if(a==="askline"){const m=getCV(j.id),line=m.sections[b.dataset.si].lines[b.dataset.li].text,v=verdict(line,analyse(j,m));
    return askClaude(`Rewrite this CV line for the ${j.title} job at ${j.company}: "${line}"
Problem: ${v[2]}
2 options, under 25 words each. Use only facts from my CV on this page, put [X] where I need a real number. No long dashes. Short answer.`)}
  if(a==="addb"){const m=getCV(j.id),s=m.sections[b.dataset.si];s.lines.push({t:"b",text:""});putCV(j.id,m);drawStudio();
    const els=document.querySelectorAll(`[data-p^="${b.dataset.si}."]`);els[els.length-1]?.focus();return}

});
document.addEventListener("input",e=>{if(!T.mode)return;const t=e.target;
  if(t.id==="jd-in"){const all=store.get("radar_jd",{});all[T.id]=t.value;store.set("radar_jd",all);clearTimeout(saveT);saveT=setTimeout(()=>{const j=job(),m=getCV(j.id),a=analyse(j,m);
    $("st-stats").innerHTML=cvStats(a);$("st-right").innerHTML=cvRight(j,m,a);$("paper").innerHTML=paperHTML(j,m,a)},500);return}
  if(t.isContentEditable&&t.dataset.p)return cvEdited(t);
});
document.addEventListener("focusout",e=>{const t=e.target;if(T.mode==="cv"&&t.isContentEditable&&t.dataset.p){const a=analyse(job(),getCV(T.id));t.innerHTML=hl(t.innerText.replace(/\n+/g," ").trim(),a.kws)}});
document.addEventListener("paste",e=>{const t=e.target.closest&&e.target.closest("[contenteditable]");if(!t||!T.mode)return;e.preventDefault();
  document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text").replace(/\s*\n\s*/g," "))});
document.addEventListener("keydown",e=>{if(!T.mode)return;
  if(e.key==="Escape"){e.preventDefault();return closeStudio()}
  const t=e.target;if(!(t.isContentEditable&&t.dataset.p))return;const[si,li]=t.dataset.p.split(".");
  if(e.key==="Enter"){e.preventDefault();if(li==="t"||!(si>=0))return t.blur();const m=getCV(T.id),s=m.sections[si],ty=s.lines[li].t==="h"?"b":s.lines[li].t;
    s.lines.splice(Number(li)+1,0,{t:ty,text:""});putCV(T.id,m);drawStudio();document.querySelector(`[data-p="${si}.${Number(li)+1}"]`)?.focus();return}
  if(e.key==="Backspace"&&!t.innerText.trim()&&li!=="t"&&si>=0){e.preventDefault();const m=getCV(T.id);m.sections[si].lines.splice(li,1);putCV(T.id,m);drawStudio();
    const prev=document.querySelector(`[data-p="${si}.${Number(li)-1}"]`)||document.querySelector(`[data-p="${si}.t"]`);if(prev){prev.focus();document.getSelection().selectAllChildren(prev);document.getSelection().collapseToEnd()}}});
</script>

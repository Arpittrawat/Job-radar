<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Radar</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16202b;--mute:#5d6b7a;--line:#dfe3e8;--accent:#1f5eff;--ok:#1a7f4b;--warn:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--panel:#171e26;--ink:#e6ebf1;--mute:#93a1b0;--line:#27313c;--accent:#6b9bff;--ok:#4cc28a;--warn:#e69a64}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button,.row button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
select,input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
label.chk{color:var(--mute);display:flex;gap:6px;align-items:center}
.health{color:var(--mute);font-size:13px;margin:0 0 14px}.health b{color:var(--ink)}.bad{color:var(--warn)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.row.applied{opacity:.6}
.t{font-weight:600;color:var(--ink);text-decoration:none}.t:hover{color:var(--accent);text-decoration:underline}
.meta{color:var(--mute);font-size:13px;margin-top:3px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;margin-right:6px;color:var(--mute)}
.pill.dupe{color:var(--warn);border-color:var(--warn)}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
</style></head><body><main>
<h1>Job Radar</h1><p class="sub" id="sub"></p>
<div class="tabs" role="group" aria-label="View">
  <button data-tab="new" aria-pressed="true">New</button>
  <button data-tab="applied" aria-pressed="false">Applied</button>
  <button data-tab="all" aria-pressed="false">All</button>
</div>
<div class="filters">
  <input type="search" id="q" placeholder="Search title or company" aria-label="Search">
  <select id="tag" aria-label="Role type"><option value="">All role types</option></select>
  <select id="loc" aria-label="Location"><option value="">Any location</option>
    <option>India</option><option>US</option><option>Remote</option><option>Other</option></select>
  <select id="source" aria-label="Source"><option value="">All sources</option></select>
  <label class="chk"><input type="checkbox" id="all"> Include jobs with no title match</label>
</div>
<p class="health" id="health"></p>
<div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id);let tab="new",DATA={jobs:[],health:[]};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mem={};
function getApplied(){try{return JSON.parse(localStorage.getItem("radar_applied")||"{}")}catch(e){return mem}}
function setApplied(o){mem=o;try{localStorage.setItem("radar_applied",JSON.stringify(o))}catch(e){}}
function ago(iso){if(!iso)return"date unknown";const h=(Date.now()-new Date(iso))/36e5;
  return h<1?"under 1h ago":h<24?Math.round(h)+"h ago":Math.round(h/24)+"d ago"}
function fillSelect(id,vals,label){const cur=$(id).value;
  $(id).innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join("")}
function render(){
  const ap=getApplied(),q=$("q").value.toLowerCase(),tag=$("tag").value,loc=$("loc").value,src=$("source").value,all=$("all").checked;
  const J=DATA.jobs;
  const inTab=j=>tab==="applied"?!!ap[j.id]:tab==="new"?(j.status==="new"&&!ap[j.id]):true;
  const rows=J.filter(j=>inTab(j)&&(all||j.tag)&&(!tag||j.tag===tag)&&(!src||j.source===src)
    &&(!loc||(","+(j.location_group||"")+",").includes(","+loc+","))
    &&(!q||(j.title||"").toLowerCase().includes(q)||(j.company||"").toLowerCase().includes(q))).slice(0,500);
  const newN=J.filter(j=>j.status==="new"&&j.tag&&!ap[j.id]).length,apN=J.filter(j=>ap[j.id]).length;
  $("sub").textContent=`${newN} new matches · ${apN} applied · ${J.length} stored`+(DATA.generated_at?` · updated ${ago(DATA.generated_at)}`:"");
  $("health").innerHTML=DATA.health.length?"Last scrape: "+DATA.health.map(h=>`<b>${esc(h.source)}</b> ${h.ok?"ok":'<span class="bad">failed</span>'} ${ago(h.ran_at)}`).join(" &nbsp; "):"No scrape has run yet.";
  $("list").innerHTML=rows.length?rows.map(j=>`<div class="row ${ap[j.id]?"applied":""}">
    <div><a class="t" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
    <div class="meta">${esc(j.company)} · ${esc(j.location||"location unknown")} · posted ${ago(j.posted_at)} · seen ${ago(j.first_seen_at)}</div>
    <div class="meta">${j.tag?`<span class="pill">${esc(j.tag)}</span>`:""}<span class="pill">${esc(j.source)}</span>${j.possible_dupe_of?'<span class="pill dupe">possible duplicate</span>':""}</div></div>
    <button data-id="${j.id}">${ap[j.id]?"Undo applied":"Mark applied"}</button></div>`).join(""):
    '<div class="empty">Nothing here. Try another tab, or tick "Include jobs with no title match".</div>';
}
async function load(){
  try{DATA=await (await fetch("jobs.json?t="+Date.now())).json()}catch(e){$("health").textContent="Could not load jobs.json yet. Run the workflow once."}
  fillSelect("tag",[...new Set(DATA.jobs.map(j=>j.tag).filter(Boolean))].sort(),"All role types");
  fillSelect("source",[...new Set(DATA.jobs.map(j=>j.source))].sort(),"All sources");
  render();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
["tag","loc","source","all"].forEach(i=>$(i).onchange=render);$("q").oninput=render;
$("list").onclick=e=>{const b=e.target.closest("button[data-id]");if(!b)return;
  const ap=getApplied();if(ap[b.dataset.id])delete ap[b.dataset.id];else ap[b.dataset.id]=1;setApplied(ap);render()};
load();
</script></body></html>
